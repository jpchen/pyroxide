# Builds the mdBook + rustdoc site and deploys it to GitHub Pages.
# Triggered manually: GitHub Pages is unavailable for private repositories on
# the free plan. Once the repository is public, add a `push: branches: [main]`
# trigger and enable Pages (Settings > Pages > Source: GitHub Actions).
name: Docs
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build book
        run: mdbook build book
      - name: Build API docs
        run: cargo doc --no-deps
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r target/book/. site/
          mkdir -p site/api
          cp -r target/doc/. site/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
