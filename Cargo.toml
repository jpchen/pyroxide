[package]
name = "pyroxide"
version = "0.1.0"
edition = "2021"
description = "A fast, decoupled probabilistic programming library for Rust: NUTS/HMC and Metropolis-Hastings with reverse-mode autodiff."
license = "Apache-2.0"
repository = "https://github.com/jpchen/pyroxide"
keywords = ["bayesian", "mcmc", "nuts", "hmc", "probabilistic-programming"]
categories = ["science", "mathematics"]

[dependencies]
rand = "0.9"
rand_distr = "0.5"
rand_xoshiro = "0.7"
rayon = "1.10"
libm = "0.2"
rustfft = "6.2"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
